version: "3.9"

services:
  slaver:
    build: .
    command: ./train 
    container_name: mnist-from-scratch-slaver-1
    deploy:
      resources:
        limits:
          cpus: "4.0"      # Dùng với docker-compose version 3.9
    cpuset: "0-3"          # Chỉ cho phép container dùng CPU core 0 đến 3
    volumes:
      - ./testing_net_single:/app/testing_net 
